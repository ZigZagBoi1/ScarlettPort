# Copy to `scarlett.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# SCARLETT_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: SCARLETT_GAME_DIR
game_dir = 'D:\scarlett-data\game'

# Derived data. Default: %LOCALAPPDATA%\ScarlettPort\cache.   env: SCARLETT_CACHE_DIR
# cache_dir = 'D:\scarlett-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\ScarlettPort\data.   env: SCARLETT_DATA_DIR
# data_dir = 'D:\scarlett-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: SCARLETT_TEST_TITLES (separated by ';')
test_titles = []
