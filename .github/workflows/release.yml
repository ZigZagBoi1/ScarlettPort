name: Release

# On a tag v*: build the launcher and the ScarlettPort runtime, assemble the ZIP
# (top level: ScarlettPort.exe, the runtime\ folder, README.txt and LICENSE.md only), write SHA-256 checksums and publish a release.
# No binaries are committed to the repository.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  AGILITY_VERSION: 1.614.1

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            launcher
            engine

      - name: Build the launcher
        working-directory: launcher
        run: |
          cargo build --release --locked
          cargo test --release --locked

      # engine/rust-toolchain.toml pins its toolchain; rustup installs it on first use.
      - name: Build the ScarlettPort runtime
        working-directory: engine
        run: cargo rustc --release -p scarlett --bin scarlett --features diagnostics --locked -- -C link-arg=/EXPORT:D3D12SDKVersion,DATA -C link-arg=/EXPORT:D3D12SDKPath,DATA

      - name: Fetch the D3D12 Agility SDK (Microsoft, NuGet)
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'agility'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Direct3D.D3D12/$env:AGILITY_VERSION" -OutFile "$tmp\agility.zip"
          Expand-Archive "$tmp\agility.zip" -DestinationPath $tmp -Force
          "AGILITY_BIN=$tmp\build\native\bin\x64" | Out-File -Append $env:GITHUB_ENV

      - name: Assemble the ZIP and checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $root = Join-Path $env:RUNNER_TEMP "ScarlettPort-$tag"
          $rt = Join-Path $root 'runtime'
          New-Item -ItemType Directory -Force (Join-Path $rt 'D3D12') | Out-Null
          Copy-Item launcher\target\release\ScarlettPort.exe $root
          Copy-Item engine\target\release\scarlett.exe (Join-Path $rt 'ScarlettPort-Runtime.exe')
          Copy-Item "$env:AGILITY_BIN\D3D12Core.dll" (Join-Path $rt 'D3D12')
          Copy-Item "$env:AGILITY_BIN\d3d12SDKLayers.dll" (Join-Path $rt 'D3D12')
          Copy-Item LICENSE.md $root
          Copy-Item engine\LICENSE (Join-Path $rt 'LICENSE-runtime.txt')
          Copy-Item engine\UPSTREAM.md (Join-Path $rt 'UPSTREAM.md')
          Copy-Item CREDITS.md $rt
          @"
          ScarlettPort $tag

          Install:
          1. Download the ZIP.
          2. Right-click it, then Extract All.
          3. Open the extracted folder (keep ScarlettPort.exe and the runtime folder together).
          4. Run ScarlettPort.exe. It finds your game folder and prepares the shaders once.

          You need your own dump of your own legally obtained copy; no game files are included.
          Source and instructions: https://github.com/${{ github.repository }}
          "@ | Set-Content (Join-Path $root 'README.txt')
          $files = Get-ChildItem $root -Recurse -File | Sort-Object FullName
          $sums = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.FullName.Substring($root.Length + 1).Replace('\', '/') }
          $sums | Set-Content (Join-Path $rt 'SHA256SUMS.txt')
          $zip = "ScarlettPort-$tag-win64.zip"
          Compress-Archive -Path "$root\*" -DestinationPath $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $zip" | Set-Content SHA256SUMS.txt
          $sums | Add-Content SHA256SUMS.txt
          $exeHash = (Get-FileHash (Join-Path $root 'ScarlettPort.exe') -Algorithm SHA256).Hash.ToLower()
          $vicHash = (Get-FileHash (Join-Path $rt 'ScarlettPort-Runtime.exe') -Algorithm SHA256).Hash.ToLower()
          @"
          One ZIP: ``ScarlettPort.exe`` (the launcher) and a ``runtime\`` folder beside it holding ``ScarlettPort-Runtime.exe`` (the World engine: the ScarlettPort runtime, GPL-3.0; lineage in UPSTREAM.md) and the Microsoft D3D12 Agility SDK DLLs. Extract the whole ZIP and keep the two side by side. Nothing is unpacked or installed at run time; an update downloads only when you click it (Settings, Options), is checked against SHA256SUMS.txt and is used from the next start. You need your own dump of your own legally obtained copy; no game files are included.

          Built from ``${{ github.sha }}`` by the [Release workflow](https://github.com/${{ github.repository }}/actions/workflows/release.yml).

          ### New in this release
          What changed is listed under this version's "New in" section of the README.

          ### Shader build
          The first run finds your game folder, then prepares the shader cache on all cores (phase, time left, Pause/Resume, or play now with live compiling). It is keyed on the engine's shader-translator fingerprint and your graphics driver, so an update that does not change the translator needs no preparation, and one that does only translates what is new. See the README FAQ if a build looks stuck.

          ### Verify the download
          These files are **not code-signed**, so Windows SmartScreen may warn on first run ("More info", then "Run anyway"). Compare the SHA-256 before running:

          | File | SHA-256 |
          |---|---|
          | ``$zip`` | ``$zipHash`` |
          | ``ScarlettPort.exe`` | ``$exeHash`` |
          | ``runtime/ScarlettPort-Runtime.exe`` | ``$vicHash`` |

          ``SHA256SUMS.txt`` lists every file. In PowerShell: ``Get-FileHash .\$zip -Algorithm SHA256``.

          ### Proof it was built from this source
          Each file in this release has a signed build attestation from GitHub Actions, tying it to commit ``${{ github.sha }}`` of this repository. With the GitHub CLI: ``gh attestation verify ScarlettPort.exe --repo ${{ github.repository }}``.

          ### If your antivirus flags it
          Check the hashes above on VirusTotal: [launcher](https://www.virustotal.com/gui/file/$exeHash), [runtime](https://www.virustotal.com/gui/file/$vicHash). Only download from this Releases page; copies posted elsewhere may be changed. New unsigned builds can be flagged by heuristics because the runtime loads and rewrites game code in memory, which is what an emulator does. Please report it as a false positive to Microsoft at https://www.microsoft.com/en-us/wdsi/filesubmission (choose "Incorrectly detected as malware/malicious"), and open an issue with the detection name and the file path so we can track it.
          "@ | Set-Content notes.md
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV
          "ROOT=$root" | Out-File -Append $env:GITHUB_ENV

      - name: Attest the build
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.ZIP }}
            ${{ env.ROOT }}/ScarlettPort.exe
            ${{ env.ROOT }}/runtime/ScarlettPort-Runtime.exe

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" "$env:ZIP" SHA256SUMS.txt --title "ScarlettPort ${{ github.ref_name }}" --notes-file notes.md --latest
