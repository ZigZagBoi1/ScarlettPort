name: Hardware report
description: Results from your GPU, even if nothing is broken
labels: [hardware-report]
body:
  - type: input
    id: gpu
    attributes:
      label: GPU and VRAM
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Driver version
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: CPU, RAM, Windows build
    validations:
      required: true
  - type: textarea
    id: runtime
    attributes:
      label: Runtime
      description: Keep the details filled in by the launcher. For a manual report, enter the launcher version and the engine you used (ScarlettPort or XCL).
    validations:
      required: true
  - type: input
    id: fps
    attributes:
      label: Frame rate
      description: Menus and world, as numbers.
  - type: textarea
    id: progress
    attributes:
      label: How far it got
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
